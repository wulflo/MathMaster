<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Entrenador progresivo de cálculo mental con soroban virtual" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eaf3ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050b14" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>MathMaster</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: #0a1830;
      }

      #loading {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        border: 0.25rem solid rgba(125, 178, 255, 0.25);
        border-top-color: #7db2ff;
        animation: anzan-spin 0.9s linear infinite;
      }

      @keyframes anzan-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading {
          animation: none;
        }
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch((error) => {
            console.warn("No se pudo registrar el service worker", error);
          });
        });
      }
    </script>
    <script type="module">
      import init from "./anzan_app.js";
      init().catch((error) => {
        console.error(error);
        document.getElementById("loading")?.remove();
      });
    </script>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite"></div>
    <noscript>MathMaster</noscript>
  </body>
</html>
