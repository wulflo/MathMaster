[package]
name = "spike-a-dioxus"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "=0.18.2", features = ["realtime", "pipewire"] }
rtrb = "0.3"

[profile.release]
opt-level = 3
debug = false
