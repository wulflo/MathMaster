# Configuración de cargo-deny para MathMaster.
# Código: AGPL-3.0-or-later. Las dependencias deben ser compatibles.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Sin excepciones activas: las advisories ignoradas antes ya no están presentes
# en el árbol de dependencias (verificado con cargo deny check).
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
