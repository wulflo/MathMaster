[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/content",
    "crates/ui",
    "crates/app",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/wulflo/MathMaster"
homepage = "https://wulflo.github.io/MathMaster/"
description = "Entrenador progresivo de cálculo mental con soroban virtual"

[workspace.dependencies]
anzan-core = { path = "crates/core", version = "0.1.0" }
anzan-engine = { path = "crates/engine", version = "0.1.0" }
anzan-content = { path = "crates/content", version = "0.1.0" }
anzan-ui = { path = "crates/ui", version = "0.1.0" }

serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"
thiserror = "=2.0.21"
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = "=0.3.107"
console_error_panic_hook = "=0.1.7"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"
